<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="356" viewBox="0 0 1200 356" role="img" aria-labelledby="title desc"><title id="title">Zahlen, die wirklich zu dir gehören.</title><desc id="desc">Öffentlich abrufbarer Stand: 11.10.2026 · Momentaufnahme, kein Live-Zähler.</desc><defs><radialGradient id="halo"><stop stop-color="#7250b9" stop-opacity=".18"/><stop offset="1" stop-color="#080d1a" stop-opacity="0"/></radialGradient><linearGradient id="edge"><stop stop-color="#b08aff"/><stop offset="1" stop-color="#52d8eb"/></linearGradient><style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:2px}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}.flow{stroke-dasharray:5 12;animation:flow 16s linear infinite}.shine{animation:shine 9s ease-in-out infinite alternate}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-204}}@keyframes shine{from{opacity:.45}to{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.flow,.shine{animation:none}}</style></defs><rect x="1" y="1" width="1198" height="354" rx="24" fill="#080d1a" stroke="#292840"/><ellipse cx="1080" cy="0" rx="550" ry="400" fill="url(#halo)"/><path d="M28 2H1172" stroke="url(#edge)" opacity=".6"/><text x="38" y="45" font-size="16" fill="#a995db" class="mono">06 / GITHUB SIGNAL</text><text x="38" y="94" font-size="32" fill="#f1edff" >Zahlen, die wirklich zu dir gehören.</text><path d="M38 120L1162 120" fill="none" stroke="#303052" /><text x="38" y="210" font-size="58" fill="#bba2ff" >0</text><text x="38" y="250" font-size="15" fill="#a7b0cd" class="mono">PUBLIC REPOS</text><path d="M38 278L284 278" fill="none" stroke="#383250" /><circle cx="276" cy="278" r="4" fill="#a386e4" class="pulse"/><text x="328" y="210" font-size="58" fill="#74d8e9" >0</text><text x="328" y="250" font-size="15