<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="332" viewBox="0 0 1200 332" role="img" aria-labelledby="title desc"><title id="title">Die Technik hinter diesem Profil.</title><desc id="desc">Keine Skill-Prozente: Das sind die Bausteine dieses READMEs.</desc><defs><radialGradient id="halo"><stop stop-color="#7250b9" stop-opacity=".18"/><stop offset="1" stop-color="#080d1a" stop-opacity="0"/></radialGradient><linearGradient id="edge"><stop stop-color="#b08aff"/><stop offset="1" stop-color="#52d8eb"/></linearGradient><style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:2px}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}.flow{stroke-dasharray:5 12;animation:flow 16s linear infinite}.shine{animation:shine 9s ease-in-out infinite alternate}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-204}}@keyframes shine{from{opacity:.45}to{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.flow,.shine{animation:none}}</style></defs><rect x="1" y="1" width="1198" height="330" rx="24" fill="#080d1a" stroke="#292840"/><ellipse cx="1080" cy="0" rx="550" ry="400" fill="url(#halo)"/><path d="M28 2H1172" stroke="url(#edge)" opacity=".6"/><text x="38" y="45" font-size="16" fill="#a995db" class="mono">03 / PROFILE TOOLKIT</text><text x="38" y="94" font-size="32" fill="#f1edff" >Die Technik hinter diesem Profil.</text><path d="M38 120L1162 120" fill="none" stroke="#303052" /><rect x="38" y="157" width="70" height="66" rx="17" fill="#211934" stroke="#7954b8"/><text x="73" y="199" font-size="23" fill="#c7a6ff" text-anchor="middle">GH</text><text x="130" y="185" font-size="27" fill="#dce4ff" >GitHub</text><text x="130" y="217" font-size="18" fill="#9baac6" >Profil &amp; Repositories</text><path d="M38 250L378 250" fill="none" stroke="#313650" /><pa