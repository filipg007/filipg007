<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="389" viewBox="0 0 1200 389" role="img" aria-labelledby="title desc"><title id="title">Vom ersten Schritt zum eigenen Auftritt.</title><desc id="desc">Profil-Meilensteine, keine erfundenen Projekt-Releases.</desc><defs><radialGradient id="halo"><stop stop-color="#7250b9" stop-opacity=".18"/><stop offset="1" stop-color="#080d1a" stop-opacity="0"/></radialGradient><linearGradient id="edge"><stop stop-color="#b08aff"/><stop offset="1" stop-color="#52d8eb"/></linearGradient><style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:2px}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}.flow{stroke-dasharray:5 12;animation:flow 16s linear infinite}.shine{animation:shine 9s ease-in-out infinite alternate}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-204}}@keyframes shine{from{opacity:.45}to{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.flow,.shine{animation:none}}</style></defs><rect x="1" y="1" width="1198" height="387" rx="24" fill="#080d1a" stroke="#292840"/><ellipse cx="1080" cy="0" rx="550" ry="400" fill="url(#halo)"/><path d="M28 2H1172" stroke="url(#edge)" opacity=".6"/><text x="38" y="45" font-size="16" fill="#a995db" class="mono">05 / PROFILE JOURNEY</text><text x="38" y="94" font-size="32" fill="#f1edff" >Vom ersten Schritt zum eigenen Auftritt.</text><path d="M38 120L1162 120" fill="none" stroke="#303052" /><path d="M130 227L1070 227" fill="none" stroke="#675090" class="flow" stroke-width="2"/><circle cx="170" cy="227" r="23" fill="#1c1738" stroke="#a37bf5"/><circle cx="170" cy="227" r="6" fill="#c8b0ff" class="pulse"/><text x="170" y="184" font-size="19" fill="#aabbed" text-anchor="middle" class="mono">2023</text><text x="170" y="293" font-size="23" fill="#e3e6fa" tex