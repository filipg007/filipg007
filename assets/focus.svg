<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="354" viewBox="0 0 1200 354" role="img" aria-labelledby="title desc"><title id="title">Was mich antreibt.</title><desc id="desc">CURRENT FOCUS</desc><defs><radialGradient id="halo"><stop stop-color="#7250b9" stop-opacity=".18"/><stop offset="1" stop-color="#080d1a" stop-opacity="0"/></radialGradient><linearGradient id="edge"><stop stop-color="#b08aff"/><stop offset="1" stop-color="#52d8eb"/></linearGradient><style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:2px}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}.flow{stroke-dasharray:5 12;animation:flow 16s linear infinite}.shine{animation:shine 9s ease-in-out infinite alternate}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-204}}@keyframes shine{from{opacity:.45}to{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.flow,.shine{animation:none}}</style></defs><rect x="1" y="1" width="1198" height="352" rx="24" fill="#080d1a" stroke="#292840"/><ellipse cx="1080" cy="0" rx="550" ry="400" fill="url(#halo)"/><path d="M28 2H1172" stroke="url(#edge)" opacity=".6"/><text x="38" y="45" font-size="16" fill="#a995db" class="mono">02 / CURRENT FOCUS</text><text x="38" y="94" font-size="32" fill="#f1edff" >Was mich antreibt.</text><path d="M38 120L1162 120" fill="none" stroke="#303052" /><text x="38" y="174" font-size="31" fill="#9d83f7" >01</text><text x="38" y="214" font-size="22" fill="#ecedff" class="mono">BUILD</text><path d="M38 237L381 237" fill="none" stroke="#303052" /><text x="38" y="274" font-size="21" fill="#dce4ff" >Ideen in Form bringen.</text><text x="38" y="309" font-size="18" fill="#9baac6" >Schritt für Schritt weiterdenken.</text><circle cx="358" cy="177" r="5" fill="#61d7e5" class="pulse"/><text x="428" y="174" font-size="31" fill="#9d83f7" >02</text><text x="428" y="214" font-size="22" fill="#ecedff" class="mono">CREATE</text><path d="M428 237L771 237" fill="none" stroke="#303052" /><text x="428" y="274" font-size="21" fill="#dce4ff" >Ein eigener visueller Stil.</text><text x="428" y="309" font-size="18" fill="#9baac6" >Kunst, Charakter und Details.</text><circle cx="748" cy="177" r="5" fill="#61d7e5" class="pulse"/><text x="818" y="174" font-size="31" fill="#9d83f7" >03</text><text x="818" y="214" font-size="22" fill="#ecedff" class="mono">EXPLORE</text><path d="M818 237L1161 237" fill="none" stroke="#303052" /><text x="818" y="274" font-size="21" fill="#dce4ff" >Neugierig bleiben.</text><text x="818" y="309" font-size="18" fill="#9baac6" >Ausprobieren und dazulernen.</text><circle cx="1138" cy="177" r="5" fill="#61d7e5" class="pulse"/></svg>